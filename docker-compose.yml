services:
  db:
    image: postgres:16
    container_name: barakat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: barakat
      POSTGRES_USER: barakat
      POSTGRES_PASSWORD: barakat_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  backend:
    build:
      context: ./backend
    container_name: barakat-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+psycopg://barakat:barakat_dev_password@172.18.0.1:5432/barakatt
      BALE_BOT_TOKEN: "1414334073:JPSKJ6n3py9F4b_nROnI4ToUonUxk_k_BjQ"
      CODESPACE_NAME: "${CODESPACE_NAME}"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions
volumes:
  postgres_data:
