services:
  db:
    image: postgres:16
    container_name: barakat-postgres
    restart: unless-stopped
    network_mode: "host"
    environment:
      POSTGRES_DB: barakat
      POSTGRES_USER: barakat
      POSTGRES_PASSWORD: barakat_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barakat -d barakat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: barakat-backend
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://barakat:barakat_dev_password@localhost:5432/barakat
      BALE_BOT_TOKEN: "1414334073:JPSKJ6n3py9F4b_nROnI4ToUonUxk_k_BjQ"
      CODESPACE_NAME: "${CODESPACE_NAME}"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

volumes:
  postgres_data:
