services:
  db:
    image: postgres:16
    container_name: barakat-postgres
    restart: unless-stopped
    network_mode: "host"
    environment:
      POSTGRES_DB: barakat
      POSTGRES_USER: barakat
      POSTGRES_PASSWORD: barakat_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    container_name: barakat-backend
    restart: unless-stopped
    depends_on:
      - db
    network_mode: "host"
    environment:
      DATABASE_URL: postgresql+psycopg://barakat:barakat_dev_password@localhost:5432/barakat
      BALE_BOT_TOKEN: "1414334073:qbjUoGRS9rCKCJ-suGCWyd6UddCU3H8pQ8A"
      CODESPACE_NAME: "${CODESPACE_NAME}"
    volumes:
      - ./backend/alembic/versions:/app/alembic/versions

volumes:
  postgres_data:
